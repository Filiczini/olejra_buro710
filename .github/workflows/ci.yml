name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'package-lock.json'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package-lock.json'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'package-lock.json'
            e2e:
              - 'e2e/**'
              - 'frontend/**'
              - 'backend/**'
              - 'shared/**'
              - 'package-lock.json'
            docs:
              - 'docs/**'

  test-shared:
    name: Test Shared
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd shared && npm run test:run

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd frontend && npm run test:run

  test-backend:
    name: Test Backend + Coverage
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd backend && npm run typecheck
      - run: cd backend && npm run test:run
      - run: cd backend && npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  test-integration:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd backend && npm run test:integration

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' || github.event_name == 'push' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bureau710_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
      - run: cd e2e && npx playwright install chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
      - run: cd backend && npm run seed:admin
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bureau710_test
          ADMIN_EMAIL: admin@admin.com
          ADMIN_PASSWORD: 11012580
      - run: cd e2e && npx playwright test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/bureau710_test
          JWT_SECRET: test-secret-that-is-at-least-32-chars-long-for-ci-only
          ADMIN_EMAIL: admin@admin.com
          ADMIN_PASSWORD: 11012580
          API_KEY: ci-test-api-key-1234567890123456789012345678901234567890
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          FRONTEND_URL: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  bundle-size:
    name: Bundle Size Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd frontend && npm run build
      - run: cd frontend && node scripts/check-bundle-size.js

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
      - run: cd frontend && npm run build
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          cd frontend && lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
