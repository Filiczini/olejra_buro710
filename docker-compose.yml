services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buro710
      POSTGRES_USER: buro710
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buro710"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    volumes:
      - uploads:/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - dokploy-network
      - default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://buro710:${DB_PASSWORD}@db:5432/buro710
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_KEY=${API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  backup:
    image: postgres:16-alpine
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
      - uploads:/uploads:ro
    environment:
      - PGHOST=db
      - PGUSER=buro710
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=buro710
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh && echo '0 3 * * * /backup.sh' | crontab - && crond -f"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  uploads:
  backups:

networks:
  dokploy-network:
    external: true
