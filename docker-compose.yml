services:
  postgres:
    image: postgres:17-alpine
    container_name: bureau710_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        BACKEND_HOST: buro710-prod-backend
    volumes:
      - uploads:/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      - dokploy-network
      - default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Host pinned to container_name (not bare "postgres") to avoid DNS alias
      # collision with other stacks on the shared dokploy-network.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bureau710_postgres:5432/${POSTGRES_DB}
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - API_KEY=${API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      default:
        aliases:
          - buro710-prod-backend
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    volumes:
      - backups:/backups
      - uploads:/uploads:ro
    environment:
      # Host pinned to container_name to avoid dokploy-network alias collision.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bureau710_postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

volumes:
  uploads:
  backups:
  postgres_data:
    driver: local

networks:
  dokploy-network:
    external: true
